name = "polyu-tennis-trigger"
main = "src/worker.ts"
compatibility_date = "2026-05-10"

[vars]
GITHUB_OWNER = "EricXue92"
GITHUB_REPO = "polyu-tennis-booker"
WORKFLOW_FILE = "book.yml"

# 00:20 UTC = 08:20 HKT — primary trigger
# 00:35 UTC = 08:35 HKT — watchdog
[triggers]
crons = ["20 0 * * *", "35 0 * * *"]
