name: Daily Tennis Booking

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't click final Submit)"
        type: boolean
        default: false
      skip_sleep:
        description: "Skip the wait until 08:30 HKT (run immediately)"
        type: boolean
        # CF Worker triggers without inputs at 07:30 HKT — booker must sleep
        # until 08:30 to hit slot-open. Override with -f skip_sleep=true for
        # ad-hoc manual runs past 08:30 (sleep_until_hkt is a no-op then).
        default: false

jobs:
  book:
    runs-on: ubuntu-latest
    # Job timeout must absorb: GH Actions runner queue (occasionally 30+ min)
    # + cold runner setup (~3 min) + Chromium install (~2 min) + sleep until
    # 08:30 HKT (up to ~60 min from 07:30 cron) + booking flow (~30 s). 90 min
    # gives margin. Worst observed queue delay: 35 min on 2026-05-16.
    timeout-minutes: 90
    env:
      TZ: Asia/Hong_Kong
      POLYU_USERNAME: ${{ secrets.POLYU_USERNAME }}
      POLYU_PASSWORD: ${{ secrets.POLYU_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run booker
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.skip_sleep }}" = "true" ]; then ARGS="$ARGS --skip-sleep"; fi
          uv run book-tennis $ARGS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: ignore
