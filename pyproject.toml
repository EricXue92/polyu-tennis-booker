[project]
name = "tennisbooking"
version = "0.1.0"
description = "Daily auto-booker for PolyU tennis courts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "freezegun>=1.5",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
